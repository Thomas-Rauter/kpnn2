name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install pytest-cov

      - name: Verify pandas type stubs for mypy
        if: matrix.python-version == '3.11'
        run: |
          python -m pip show pandas-stubs

      - name: Run Ruff lint
        run: |
          python -m ruff --version
          python -m ruff check .

      - name: Run Ruff format check
        run: |
          python -m ruff format --check .

      - name: Validate NumPy docstrings
        run: |
          numpydoc lint src/kpnn2/*.py

      - name: Run mypy
        if: matrix.python-version == '3.11'
        run: |
          mypy src

      - name: Run non-slow tests with coverage
        run: |
          pytest \
            -m "not slow" \
            --cov=kpnn2 \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html

      - name: Run slow tests
        if: matrix.python-version == '3.11'
        run: |
          pytest -m slow

      - name: Upload HTML coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov/

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Thomas-Rauter/kpnn2

      - name: Build package
        if: matrix.python-version == '3.11'
        run: |
          python -m build

      - name: Check package metadata
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - name: Smoke test installed wheel
        if: matrix.python-version == '3.11'
        run: |
          python -m venv /tmp/kpnn2-wheel-test
          /tmp/kpnn2-wheel-test/bin/python -m pip install --upgrade pip
          /tmp/kpnn2-wheel-test/bin/python -m pip install dist/*.whl
          cp tests/api/test_core_smoke.py /tmp/wheel_smoke.py
          cd /tmp
          /tmp/kpnn2-wheel-test/bin/python /tmp/wheel_smoke.py

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system Graphviz
        run: |
          # GitHub Ubuntu runners prefer azure.archive.ubuntu.com, which can stall apt for hours.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[docs]

      - name: Execute docs notebooks
        run: |
          python scripts/docs_notebooks.py

      - name: Build documentation
        run: |
          mkdocs build --strict
