  <circle cx="36" cy="139.4" r="3.5" fill="#fff" stroke="#000" stroke-width="0.6"/>
  <text x="42.5" y="141" text-anchor="start" fill="#000" font-weight="400" font-size="5">Node</text>
  <text x="68" y="141" text-anchor="start" fill="#000" font-size="5"><tspan font-style="italic">z</tspan><tspan dy="2" font-size="5">a</tspan></text>
