<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 240 72"
     font-family="Liberation Sans, sans-serif"
     font-size="6"
     fill="none">
  <!-- Adjacent hops: A -> H -> C -->
  <rect x="12" y="28" width="36" height="16" stroke="#000" stroke-width="0.6"/>
  <text x="30" y="38.5" text-anchor="middle" fill="#000">A</text>
  <text x="30" y="22" text-anchor="middle" fill="#000">layer 0</text>

  <line x1="48" y1="36" x2="86" y2="36" stroke="#000" stroke-width="0.6"
        marker-end="url(#arrow)"/>
  <text x="67" y="32" text-anchor="middle" fill="#000">mask[0]</text>

  <rect x="86" y="28" width="36" height="16" stroke="#000" stroke-width="0.6"/>
  <text x="104" y="38.5" text-anchor="middle" fill="#000">H</text>
  <text x="104" y="22" text-anchor="middle" fill="#000">layer 1</text>

  <line x1="122" y1="36" x2="160" y2="36" stroke="#000" stroke-width="0.6"
        marker-end="url(#arrow)"/>
  <text x="141" y="32" text-anchor="middle" fill="#000">mask[1]</text>

  <rect x="160" y="28" width="36" height="16" stroke="#000" stroke-width="0.6"/>
  <text x="178" y="38.5" text-anchor="middle" fill="#000">C</text>
  <text x="178" y="22" text-anchor="middle" fill="#000">layer 2</text>

  <!-- Skip residual: saved A added at C -->
  <path d="M30 44 C30 62, 178 62, 178 44"
        stroke="#000" stroke-width="0.6" stroke-dasharray="2 1.2"
        marker-end="url(#arrow)"/>
  <text x="104" y="68" text-anchor="middle" fill="#000">
    skip: C += w * saved A
  </text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
  </defs>
</svg>
