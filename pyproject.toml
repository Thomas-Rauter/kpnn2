[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kpnn2"
version = "0.2.0"
description = "Turn a named edgelist into sparsely connected PyTorch layers you assemble yourself."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Thomas Rauter" }
]
dependencies = [
    "torch>=2.1,<3",
    "pandas>=2.2,<3",
    "numpy>=1.24,<3",
    "xarray>=2024.11,<2025.7; python_version < '3.11'",
    "xarray>=2026.4,<2026.8; python_version >= '3.11'",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://thomas-rauter.github.io/kpnn2/"
Documentation = "https://thomas-rauter.github.io/kpnn2/"
Repository = "https://github.com/Thomas-Rauter/kpnn2"
Issues = "https://github.com/Thomas-Rauter/kpnn2/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff==0.16.4",
    "mypy",
    "pandas-stubs>=2.3.3,<2.4",
    "build",
    "scikit-learn",
    "captum",
    "numpydoc==1.10.0",
    "scipy-doctest==2.2.0",
    "pre-commit",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-jupyter",
    "mkdocs-include-markdown-plugin",
    "pymdown-extensions",
    "nbconvert",
    "ipykernel",
    "ipywidgets",
    "graphviz",
    "IPython",
    "seaborn",
    "captum",
    "black",
    "mike>=2,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["kpnn2*"]
namespaces = false

[tool.ruff]
line-length = 80
target-version = "py310"
extend-exclude = [
    "*.md",
    "tests/manual",
]

[tool.ruff.lint]
select = ["E", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"docs/**" = ["D"]
"scripts/**" = ["D"]
"noxfile.py" = ["D"]
"conftest.py" = ["D"]
# Temporary: existing summaries wrap at 80 cols (D200/D205) or use
# a descriptive rather than imperative mood (D401). Shrink this list
# when those docstrings are reformatted; new modules are held to D.
"src/kpnn2/__init__.py" = ["D205"]
"src/kpnn2/_adjacency_spec.py" = ["D200"]
"src/kpnn2/_align.py" = ["D200"]
"src/kpnn2/_attributions.py" = ["D200"]
"src/kpnn2/_errors.py" = ["D200"]
"src/kpnn2/_gather.py" = ["D200", "D205"]
"src/kpnn2/_layout.py" = ["D200", "D401"]
"src/kpnn2/_mask_tensor.py" = ["D200"]
"src/kpnn2/_masked_linear.py" = ["D200"]
"src/kpnn2/_packed_linear.py" = ["D200"]
"src/kpnn2/_packed_multihead_attention.py" = ["D200", "D205"]
"src/kpnn2/_parse.py" = ["D200"]
"src/kpnn2/_parse_adjacency.py" = ["D200"]
"src/kpnn2/_serialize.py" = ["D205"]
"src/kpnn2/_spec.py" = ["D200"]

[tool.numpydoc_validation]
checks = [
    "all",
    "EX01",  # example not required on every object
    "SA01",  # See Also not required on every object
    "ES01",  # extended summary not required on every object
    "SS06",  # 80-col wrap makes one-line summaries wrap
]
exclude = [
    '\.__init__$',
    '\.__repr__$',
    '\.__str__$',
    '\.__eq__$',
    '\.__post_init__$',
    '\._',  # private helpers; public names stay checked
    '\.(forward|extra_repr)$',  # nn.Module call/repr idiom
    # Dataclass fields are documented on the class; the AST
    # hook does not see the generated __init__, so PR02 is a
    # false positive. Methods on these classes stay checked.
    '\.Hop$',
    '\.Skip$',
    '\.LayeredSpec$',
    '\.AdjacencySpec$',
    '\.column_offsets$',
    '\.MaskedLinear\.mask$',
]
exclude_files = [
    '^tests/',
    '^docs/',
    '^scripts/',
    '^conftest.py$',
    # Temporary: internal modules, not the public façade.
    '^src/kpnn2/_layout.py$',
    '^src/kpnn2/_mask_tensor.py$',
]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["xarray", "xarray.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = [
    "-p",
    "scipy_doctest",
    "--doctest-modules",
    "--ignore=tests/manual",
]
testpaths = [
    "tests",
    "src",
]
pythonpath = [
    "src",
    ".",
]
filterwarnings = [
    "ignore:numpy.core.multiarray is deprecated:DeprecationWarning",
]
markers = [
    "integration: tests that train models or use real datasets",
    "slow: tests that train models and are only run on one CI Python version",
]
