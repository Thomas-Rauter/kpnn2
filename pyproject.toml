[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kpnn2"
version = "0.1.0"
description = "Build sparsely connected PyTorch neural networks from a named edgelist, using native nn.Module layers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Thomas Rauter" }
]
dependencies = [
    "torch>=2.1,<3",
    "pandas>=2.2,<3",
    "numpy>=1.24,<3",
    "xarray>=2024.11,<2025.7; python_version < '3.11'",
    "xarray>=2026.4,<2026.8; python_version >= '3.11'",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://thomas-rauter.github.io/kpnn2/"
Documentation = "https://thomas-rauter.github.io/kpnn2/"
Repository = "https://github.com/Thomas-Rauter/kpnn2"
Issues = "https://github.com/Thomas-Rauter/kpnn2/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff==0.16.4",
    "mypy",
    "pandas-stubs>=2.3.3,<2.4",
    "build",
    "scikit-learn",
    "captum",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-jupyter",
    "mkdocs-include-markdown-plugin",
    "pymdown-extensions",
    "nbconvert",
    "ipykernel",
    "ipywidgets",
    "graphviz",
    "IPython",
    "seaborn",
    "captum",
    "black",
    "mike>=2,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["kpnn2*"]
namespaces = false

[tool.ruff]
line-length = 80
target-version = "py310"
extend-exclude = [
    "*.md",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["xarray", "xarray.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [
    "src",
    ".",
]
filterwarnings = [
    "ignore:numpy.core.multiarray is deprecated:DeprecationWarning",
]
markers = [
    "integration: tests that train models or use real datasets",
    "slow: tests that train models and are only run on one CI Python version",
]
