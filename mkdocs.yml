site_name: kpnn2
site_description: >
  Build interpretable neural networks in PyTorch from a graph of
  named entities, with checks that every attribution is reported
  under the right name.
site_url: https://thomas-rauter.github.io/kpnn2/
site_dir: out/site
repo_url: https://github.com/Thomas-Rauter/kpnn2
repo_name: Thomas-Rauter/kpnn2

theme:
  name: material
  logo: figures/kpnn2_logo.svg
  favicon: figures/kpnn2_logo.svg
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/hide_input.js

extra:
  version:
    provider: mike
    default: latest

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Supported architectures: supported.md
      - Feedforward example: feedforward-example.ipynb
  - Additional examples:
      - Cyclic graph example: cyclic-graph-example.ipynb
      - Time-series example: time-series-example.ipynb
      - Transformer example: transformer-example.ipynb
  - Background:
      - Why kpnn2: why_kpnn2.md
      - Terminology: concepts.md
  - How it works:
      - Layered vs. unlayered: layered_vs_adjacency.md
      - Edges that skip layers: skip-edges.ipynb
      - How a cycle runs: unrolling-a-cycle.ipynb
      - "PackedLinear: one weight per edge": packed_linear.md
  - Attributions:
      - Attributions by node name: map-node-attributions.ipynb
      - Correcting for network bias: network-bias.ipynb
  - Reference:
      - API: reference/api.md
  - Validation:
      - How we test: how_we_test.md
      - Fortelny and Bock 2020: literature/fortelny-bock-2020.ipynb
  - Project:
      - Changelog: changelog.md
      - Citing: citing.md
      - Feedback: feedback.md

validation:
  links:
    anchors: warn
    unrecognized_links: warn
    absolute_links: warn

exclude_docs: |
  includes/

not_in_nav: |
  /reference/*.md
  /reference/aggregation/*.md
  /literature/*.md

hooks:
  - dev/docs_notebooks.py
  - dev/docs_readme_urls.py
  - dev/docs_signatures.py

plugins:
  - search
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            heading_level: 1
            show_root_heading: true
            show_root_toc_entry: true
            show_root_full_path: false
            show_symbol_type_heading: false
            show_symbol_type_toc: false
            show_category_heading: true
            parameter_headings: true
            show_signature: true
            show_signature_annotations: true
            separate_signature: true
            line_length: 60
            show_source: false
            merge_init_into_class: true
            docstring_section_style: table
            filters:
              - "!^_"
  - mkdocs-jupyter:
      include:
        - "*.ipynb"
        - "literature/*.ipynb"
      ignore:
        - "*.md"
      include_source: true
      execute: false
      # Cells tagged remove-input show only their output (drawing
      # code). mkdocs-jupyter reads only the first tag of each list.
      remove_tag_config:
        remove_input_tags:
          - remove-input
      ignore_h1_titles: true
      # The plugin default is "", which loads no MathJax. Its notebook
      # template configures MathJax 2, so the URL must stay on 2.x.
      custom_mathjax_url: "https://cdnjs.cloudflare.com/ajax/libs/\
        mathjax/2.7.7/latest.js?config=TeX-AMS_CHTML-full,Safe"

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - docs
      auto_append:
        - includes/abbreviations.md
