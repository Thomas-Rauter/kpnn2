site_name: kpnn2
site_description: >
  Turn a named edgelist into sparsely connected PyTorch layers
  you assemble yourself.
site_url: https://thomas-rauter.github.io/kpnn2/
repo_url: https://github.com/Thomas-Rauter/kpnn2
repo_name: Thomas-Rauter/kpnn2

theme:
  name: material
  logo: figures/kpnn2_logo.svg
  favicon: figures/kpnn2_logo.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

extra:
  version:
    provider: mike
    default: latest

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Getting started: getting-started.ipynb
  - Additional examples:
      - Recurrent example: recurrent-example.ipynb
      - Transformer example: transformer-example.ipynb
  - How it works:
      - Layered vs. Adjacency: layered_vs_adjacency.md
      - Skip edges: skip-edges.ipynb
      - Mapping attributions: map-node-attributions.ipynb
      - PackedLinear: packed_linear.md
  - Reference:
      - Index: reference/index.md
  - Project:
      - Changelog: changelog.md
      - Citing: citing.md
      - Feedback: feedback.md

not_in_nav: |
  /reference/*.md

hooks:
  - scripts/docs_notebooks.py

plugins:
  - search
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            heading_level: 1
            show_root_heading: true
            show_root_toc_entry: true
            show_root_full_path: false
            show_symbol_type_heading: false
            show_symbol_type_toc: false
            show_category_heading: true
            parameter_headings: true
            show_signature: true
            show_signature_annotations: true
            separate_signature: true
            line_length: 60
            show_source: false
            merge_init_into_class: true
            docstring_section_style: table
            filters:
              - "!^_"
  - mkdocs-jupyter:
      include:
        - "*.ipynb"
      ignore:
        - "*.md"
      include_source: true
      execute: false
      ignore_h1_titles: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
